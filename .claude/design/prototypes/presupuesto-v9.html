function m(x){return x.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function byId(id){for(var i=0;i<cats.length;i++){if(cats[i].id===id)return cats[i]}return null}
function sgn(x,t){return (x<0?'−':(t?'+':''))+'Q '+m(Math.abs(x))}
function cls(x){return x>=0?'pos':'neg'}
function shown(c){return c.budget!=null||c.actual>0}
function status(c){
if(c.budget==null){return 'none'}
if(c.actual>c.budget){return 'over'}
if(c.pending>0&&c.actual+c.pending>c.budget){return 'may'}
if(Math.abs(c.actual-c.budget)<0.005){return 'exact'}
return 'ok'}
function pct(c){return c.budget?Math.round(c.actual/c.budget*100):0}
function rank(c){var s=status(c);return s==='over'?0:s==='may'?1:s==='none'?3:2}
function driftR(r){
if(!r.avg||r.ok){return false}
var df=Math.abs(r.avg-r.b);
return df>=20&&df/r.b>=0.10}
function suggest(c){var t=0;c.rec.forEach(function(r){t+=r.b});return Math.round(t*100)/100}
function totals(){
var paid=0,pend=0;
cats.forEach(function(c){paid+=c.actual;pend+=c.pending});
var net=money.received-paid;
return{paid:paid,pend:pend,net:net,proj:net+money.pendingIncome-pend,overall:money.allIncome-money.allExpenses}}

function chipOf(s){
if(s==='over'){return '<span class="chip danger"><i class="ti ti-alert-circle" aria-hidden="true"></i> Sobre presupuesto</span>'}
if(s==='may'){return '<span class="chip warn"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Podría excederse</span>'}
return ''}
function detail(c,s){
var h='<div class="dtl">';
if(c.budget!=null){
h+='<p class="sub">'+(s==='over'?'<span class="neg">Excedido por Q '+m(c.actual-c.budget)+'</span> · '+pct(c)+' % del presupuesto':s==='exact'?'<span class="pos">Justo en el presupuesto</span> · 100 %':'Te quedan Q '+m(c.budget-c.actual)+' · '+pct(c)+' % usado')+'</p>';
if(c.pending>0){var pj=c.actual+c.pending;h+='<p class="sub" style="margin-top:4px'+(pj>c.budget?';color:var(--text-warning)':'')+'">Con lo que falta pagar (Q '+m(c.pending)+') llegarías a Q '+m(pj)+' · '+Math.round(pj/c.budget*100)+' %</p>'}}
else{h+='<p class="sub">Sin presupuesto. Fija una meta mensual para ver cuánto te queda.</p>'}
if(c.rec.length){
h+='<p class="cap" style="margin:10px 0 0">Recurrentes</p>';
c.rec.forEach(function(r,i){
var dr=driftR(r);
var d=r.avg==null?'Aún sin historial de pagos':'Promedio 6 meses Q '+m(r.avg);
h+='<div class="drl"><span class="n">'+esc(r.n)+(dr?'':'<span class="t2 bl">'+d+'</span>')+'</span><span>Q '+m(r.b)+'</span></div>';
if(dr){h+='<div class="chipw" style="border-radius:8px;border-top:none;margin:2px 0 6px"><span>Promedio 6 meses Q '+m(r.avg)+' vs presupuestado Q '+m(r.b)+'</span><div class="chb"><button data-id="'+c.id+'" data-i="'+i+'" onclick="A.rupd(this)">Actualizar presupuesto</button><button data-id="'+c.id+'" data-i="'+i+'" onclick="A.rkeep(this)">Mantener actual</button></div></div>'}});
h+='<p class="sub" style="margin-top:6px">Para cambiar un recurrente, edítalo en Gastos.</p>'}
else{h+='<p class="sub" style="margin-top:8px">Sin recurrentes en esta categoría: el gasto viene de pagos únicos.</p>'}
h+=(c.budget==null?'<div class="acts"><button data-id="'+c.id+'" onclick="A.edit(this)">Fijar presupuesto</button></div>':'')+'</div>';
return h}
function catCard(c){
var s=status(c),p=pct(c),op=!!S.open[c.id],hasB=c.budget!=null;
var lab=c.name+(hasB?', '+p+' % del presupuesto, gastado Q '+m(c.actual)+' de Q '+m(c.budget):', gastado Q '+m(c.actual)+', sin presupuesto')+(s==='over'?', sobre presupuesto':s==='may'?', podría excederse':s==='exact'?', justo en el presupuesto':'')+'. '+(op?'Ocultar':'Ver')+' detalles';
var h='<div class="cc'+(s==='over'?' over':'')+'"><button class="ch2" data-id="'+c.id+'" aria-expanded="'+(op?'true':'false')+'" aria-label="'+esc(lab)+'" onclick="A.tg(this)"><span class="cr"><span class="nm2"><span class="t1 bl">'+esc(c.name)+'</span>'+chipOf(s)+'</span><span class="am2"><span class="a1">Q '+m(c.actual)+'</span>'+(hasB?'<span class="a2">de Q '+m(c.budget)+'</span>':'<span class="a2">sin presupuesto</span>')+'</span><i class="ti ti-chevron-down chev" aria-hidden="true" style="'+(op?'transform:rotate(180deg)':'')+'"></i></span>';
if(hasB){var f=s==='over'?'f-over':s==='may'?'f-near':s==='exact'?'f-exact':'f-ok';h+='<span class="pb2"><span class="'+f+'" style="width:'+Math.min(p,100)+'%"></span></span>'}
h+='</button>'+(op?detail(c,s):'')+'</div>';
return h}

function render(){
document.getElementById('cyc').textContent=CYCLE;
var t=totals(),h='';
h+='<div class="card sum"><div class="sumh"><p class="cap">Este mes</p><button class="ib" aria-label="Cómo se calcula el resumen" onclick="A.info()"><i class="ti ti-info-circle" aria-hidden="true"></i></button></div>';
h+='<div class="g3"><div class="cell"><span class="cl">Recibido</span><span class="cv pos">'+sgn(money.received,true)+'</span></div><div class="cell"><span class="cl">Pagado</span><span class="cv neg">−Q '+m(t.paid)+'</span></div><div class="cell res"><span class="cl">Saldo actual</span><span class="cv '+cls(t.net)+'">'+sgn(t.net)+'</span></div></div>';
h+='<p class="cap">Lo que falta</p>';
h+='<div class="g3"><div class="cell"><span class="cl">Falta pagar</span><span class="cv neg">−Q '+m(t.pend)+'</span></div><div class="cell"><span class="cl">Falta recibir</span><span class="cv pos">+Q '+m(money.pendingIncome)+'</span></div><div class="cell res"><span class="cl">Saldo proyectado</span><span class="cv '+cls(t.proj)+'">'+sgn(t.proj)+'</span></div></div>';
h+='<div class="foot"><span class="lb">Balance general</span><span class="vl '+cls(t.overall)+'">'+sgn(t.overall)+'</span></div></div>';
var list=cats.filter(shown);
var withB=list.filter(function(c){return c.budget!=null}),noB=list.filter(function(c){return c.budget==null});
var attn=withB.filter(function(c){var s=status(c);return s==='over'||s==='may'}).length;
h+='<div class="sh"><h2>Categorías</h2><span>'+(attn?attn+(attn===1?' requiere atención':' requieren atención'):'')+'</span></div>';
withB.sort(function(a,b){var d=rank(a)-rank(b);if(d)return d;if(rank(a)===0){return (b.actual-b.budget)-(a.actual-a.budget)}return pct(b)-pct(a)});
noB.sort(function(a,b){return b.actual-a.actual});
if(!list.length){h+='<p class="sub" style="margin:0 2px">Aún no hay gasto ni presupuestos este mes. Fija un presupuesto en una categoría para empezar.</p>'}
h+=withB.map(catCard).join('');
if(noB.length){
h+='<button class="grp" aria-expanded="'+(!!S.noB)+'" onclick="A.nb()"><span class="cap" style="font-size:13px">Sin presupuesto · '+noB.length+'</span><i class="ti ti-chevron-down chev" aria-hidden="true" style="'+(S.noB?'transform:rotate(180deg)':'')+'"></i></button>';
if(S.noB){h+=noB.map(catCard).join('')}}
document.getElementById('main').innerHTML=h;
document.getElementById('msg').innerHTML=S.msg}

/* ---------- avisos ---------- */
function pre(){S.pre=JSON.stringify(cats)}
function noSnack(){clearTimeout(S.tm);S.pre=null;S.snk=null;document.getElementById('snack').hidden=true}
function snack(txt,btns){
var s=document.getElementById('snack');clearTimeout(S.tm);
btns=btns||[{lb:'Deshacer',fn:function(){A.undo()}}];S.snk=btns;
s.innerHTML='<span>'+txt+'</span>'+btns.map(function(b,i){return '<button onclick="A.snackAct('+i+')">'+b.lb+'</button>'}).join('');
s.hidden=false;S.tm=setTimeout(function(){s.hidden=true;S.snk=null},8000)}
/* ---------- hoja ---------- */
function actBtn(a,ic,lb,ds,cls){return '<button class="act'+(cls?' '+cls:'')+'" data-a="'+a+'"><i class="ti '+ic+'" aria-hidden="true"></i><span><span class="al">'+lb+'</span><span class="ad">'+ds+'</span></span></button>'}
function sheet(){
var el=document.getElementById('sheet');
if(!S.sh){el.hidden=true;el.innerHTML='';document.body.style.overflow='';return}
var v=S.sh.view,c=S.sh.id?byId(S.sh.id):null;
var title=v==='info'?'Cómo se calcula':'Fijar presupuesto';
var h='<div class="sp" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="grab"></div><div class="sph"><h2 id="sht">'+title+'</h2><button class="kb" style="margin:0" aria-label="Cerrar" data-a="close"><i class="ti ti-x" aria-hidden="true"></i></button></div>';
if(v==='info'){
var li=function(b,t){return '<div style="padding:8px 0;border-top:0.5px solid var(--border);font-size:14px"><span class="al bl" style="font-size:14px">'+b+'</span><span class="t2 bl">'+t+'</span></div>'};
h+='<div style="margin:6px 0 4px">'+li('Saldo actual','Lo recibido menos lo pagado este mes.')+li('Falta pagar','Lo que vence este mes y aún no pagas. El Panel también cuenta vencidos de meses anteriores.')+li('Saldo proyectado','Saldo actual, menos lo que falta pagar, más lo que falta recibir. Es lo que te quedaría a fin de mes.')+li('Balance general','Todo lo recibido menos todo lo pagado desde que usas la app. No incluye un saldo inicial, así que no es el saldo de tu cuenta.')+'</div><p class="cap" style="margin:10px 0 2px">Colores de las barras</p><div class="lgd"><i class="f-over"></i>Se pasó del presupuesto</div><div class="lgd"><i class="f-near"></i>Podría pasarse con lo que falta pagar</div><div class="lgd"><i class="f-exact"></i>Justo en el presupuesto</div><div class="lgd"><i class="f-ok"></i>Dentro del presupuesto</div><div class="fb"><button data-a="panel">Ver en el Panel</button><button class="pri" data-a="close">Entendido</button></div>'}
else{
h+='<label class="fl" for="s-b">Presupuesto mensual (Q)</label><input id="s-b" class="fi" type="text" inputmode="decimal" autocomplete="off" value="'+(c.budget!=null?c.budget:'')+'" placeholder="0.00">';
var sg=suggest(c);
if(sg>0&&sg!==c.budget){h+='<p class="hint">Según tus recurrentes de esta categoría: Q '+m(sg)+'. El resto (gastos únicos) no se cuenta ahí. <button class="dt" style="display:inline-flex;min-height:44px" data-a="use" data-v="'+sg+'">Usar sugerido</button></p>'}
h+='<p id="s-err" class="ferr" role="alert" hidden></p><div class="fb"><button data-a="close">Cancelar</button><button class="pri" data-a="save">Guardar</button></div>'}
h+='</div>';
el.innerHTML=h;el.hidden=false;document.body.style.overflow='hidden';
var f=el.querySelector('.fi')||el.querySelector('.act')||el.querySelector('.fb button');
if(f){f.focus()}}
function closeSheet(){
var o=S.sh&&S.sh.key;
S.sh=null;sheet();render();
var b=o?document.querySelector('.ch2[data-id="'+o+'"]'):null;
if(b){b.focus()}}
var A={
rupd:function(b){
var c=byId(b.dataset.id),r=c.rec[+b.dataset.i];
noSnack();pre();r.b=Math.round(r.avg*100)/100;S.msg='';render();
snack('Presupuesto de «'+esc(r.n)+'» actualizado a Q '+m(r.b)+' desde el próximo mes.',[{lb:'Deshacer',fn:function(){A.undo()}},{lb:'Editar',fn:function(){noSnack();S.msg='Abriría «'+esc(r.n)+'» en Gastos → Recurrentes.';render()}}])},
rkeep:function(b){
var c=byId(b.dataset.id),r=c.rec[+b.dataset.i];
noSnack();pre();r.ok=true;S.msg='';render();
snack('Se mantiene el presupuesto de «'+esc(r.n)+'». Te avisaremos si el promedio se aleja más.')},
undo:function(){if(S.pre){cats=JSON.parse(S.pre)}clearTimeout(S.tm);S.pre=null;S.snk=null;document.getElementById('snack').hidden=true;S.msg='Cambio deshecho.';render()},
snackAct:function(i){var b=S.snk&&S.snk[i];if(b){b.fn()}},
edit:function(b){S.msg='';S.sh={view:'edit',id:b.dataset.id,key:b.dataset.id};sheet()},
info:function(){S.sh={view:'info'};sheet()},
tg:function(b){S.open[b.dataset.id]=!S.open[b.dataset.id];render();var n=document.querySelector('.ch2[data-id="'+b.dataset.id+'"]');if(n){n.focus()}},
nb:function(){S.noB=!S.noB;render();var n=document.querySelector('.grp');if(n){n.focus()}},
act:function(a,b){
if(a==='close'){closeSheet();return}
var c=S.sh.id?byId(S.sh.id):null;
if(a==='panel'){S.msg='Abriría el Panel, con lo pendiente de este mes y de meses anteriores.';closeSheet();return}
if(a==='use'){document.getElementById('s-b').value=b.dataset.v;return}
if(a==='save'){
var v=parseFloat(document.getElementById('s-b').value.replace(/,/g,''));
if(!(v>0)){var er=document.getElementById('s-err');er.textContent='Escribe un monto mayor que 0.';er.hidden=false;return}
c.budget=Math.round(v*100)/100;S.msg='Presupuesto de «'+esc(c.name)+'» fijado en Q '+m(c.budget)+'.';closeSheet();return}
}
};
document.getElementById('sheet').addEventListener('click',function(ev){
var b=ev.target.closest('[data-a]');
if(b){A.act(b.dataset.a,b)}else if(ev.target===this){closeSheet()}});
document.addEventListener('keydown',function(ev){
if(!S.sh){return}
if(ev.key==='Escape'){closeSheet();return}
if(ev.key==='Tab'){
var sp=document.querySelector('#sheet .sp');if(!sp){return}
var f=Array.prototype.filter.call(sp.querySelectorAll('button,input'),function(n){return !n.disabled});
if(!f.length){return}
var first=f[0],last=f[f.length-1];
if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
render();
</script>
</body>
</html>
