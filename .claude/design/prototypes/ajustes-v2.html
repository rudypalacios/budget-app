function ds(s){var p=s.split('-');return (+p[2])+' '+MN[+p[1]]}
function dd(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function daysLeft(t){return st.retention-dd(t.date,TODAY)}
function plural(n,a,b){return n+' '+(n===1?a:b)}
function stale(){return curs.filter(function(c){return c.status==='stale'}).length}
function catById(id){for(var i=0;i<cats.length;i++){if(cats[i].id===id)return cats[i]}return null}
function grpById(id){for(var i=0;i<groups.length;i++){if(groups[i].id===id)return groups[i]}return null}
function tName(t){return {expense:'Gasto',income:'Ingreso',both:'Ambos'}[t]}
function sym(){return SYM[st.def]||st.def}
function curOf(code){for(var i=0;i<curs.length;i++){if(curs[i].code===code)return curs[i]}return null}
function pending(){return archive.length+' '+(archive.length===1?'elemento archivado':'elementos archivados')}

/* ---------- pantallas ---------- */
function head(title){return '<div class="fh"><button class="back" aria-label="Volver a Ajustes" onclick="A.back()"><i class="ti ti-chevron-left" aria-hidden="true"></i></button><h1>'+title+'</h1></div>'}
function rowBtn(ic,label,val,call,extra){return '<button class="srow btn2" onclick="'+call+'"'+(extra||'')+'>'+(ic?'<span class="cic"><i class="ti '+ic+'" aria-hidden="true"></i></span>':'')+'<span class="grow"><span class="t1 bl">'+label+'</span></span><span class="val">'+val+'</span><i class="ti ti-chevron-right" aria-hidden="true" style="color:var(--text-muted)"></i></button>'}
function secH(t){return '<h2 class="sech" style="margin:16px 2px 6px;font-size:13px;color:var(--text-secondary);font-weight:500;text-transform:none">'+t+'</h2>'}
function seg3(name,opts,val,call){return '<div class="seg" role="group" aria-label="'+name+'" style="margin:0">'+opts.map(function(o){return '<button aria-pressed="'+(o[0]===val)+'" onclick="'+call+'(\''+o[0]+'\')">'+o[1]+'</button>'}).join('')+'</div>'}
function vRoot(){
var h='<div class="hd"><h1>Ajustes</h1></div>';
h+=secH('Cuenta');
if(user.signedIn){h+='<div class="set"><div class="srow"><span class="cic"><i class="ti ti-user-circle" aria-hidden="true"></i></span><span class="grow"><span class="t1 bl">'+esc(user.email)+'</span><span class="sub bl"><i class="ti ti-circle-check" aria-hidden="true"></i> Sincronizado</span></span></div><button class="srow btn2" onclick="A.signout()"><span class="grow"><span class="t1 bl">Cerrar sesión</span></span><i class="ti ti-logout" aria-hidden="true" style="color:var(--text-muted)"></i></button></div>'}
else{h+='<div class="set"><button class="srow btn2" onclick="A.login()"><span class="grow"><span class="t1 bl">Crear cuenta / Iniciar sesión</span><span class="sub bl">Tus datos hoy solo están en este dispositivo.</span></span><i class="ti ti-chevron-right" aria-hidden="true" style="color:var(--text-muted)"></i></button></div>'}
h+=secH('General');
h+='<div class="set">'+rowBtn('','Moneda predeterminada',esc(sym()+' ('+st.def+')'),'A.defcur()',' data-row="def"')+rowBtn('','Idioma',esc(langName(st.lang)),'A.langOpen()',' data-row="lang"')+'<div class="srow" style="display:block;padding:10px 14px"><span class="t1 bl" id="th-l">Tema</span><div style="margin-top:6px">'+seg3('Tema',[['light','Claro'],['dark','Oscuro'],['system','Sistema']],st.theme,'A.theme')+'</div></div></div>';
h+=secH('Administrar');
var sc=stale();
h+='<div class="set">'+rowBtn('ti-coin','Monedas',plural(curs.length,'agregada','agregadas')+(sc?'<span class="chip2">'+sc+' por actualizar</span>':''),"A.go('curs')")+rowBtn('ti-tool','Categorías',plural(cats.length,'categoría','categorías'),"A.go('cats')")+rowBtn('ti-folder','Grupos recurrentes',plural(groups.length,'grupo','grupos'),"A.go('groups')")+'</div>';
h+=secH('Recordatorios');
h+='<div class="set"><label class="srow" style="cursor:pointer"><span class="grow"><span class="t1 bl">Activar recordatorios</span><span class="sub bl">Un aviso antes de cada vencimiento.</span></span><input class="ck" type="checkbox" role="switch" id="rem-on" '+(st.rem.on?'checked':'')+' onchange="A.remOn(this)" aria-label="Activar recordatorios"></label>';
if(st.rem.on){h+='<div class="srow"><span class="grow"><span class="t1 bl">Días de anticipación</span></span><div class="stp"><button aria-label="Un día menos" onclick="A.lead(-1)">−</button><output aria-live="polite" id="lead-v">'+st.rem.lead+'</output><button aria-label="Un día más" onclick="A.lead(1)">+</button></div></div><div class="srow"><label class="grow" for="rem-t"><span class="t1 bl">Hora del aviso</span></label><select id="rem-t" onchange="A.remT(this)" style="min-height:44px">'+[['','Sin hora fija'],['08:00','8:00'],['09:00','9:00'],['12:00','12:00'],['18:00','18:00'],['20:00','20:00']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===st.rem.time?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'}
h+='</div><p class="sub" style="margin:0 2px 0">Cada recurrente puede tener su propio aviso: se cambia en Gastos.</p>';
h+=secH('Datos');
h+='<div class="set">'+rowBtn('','Retención de la papelera',st.retention+' días',"A.ret()")+rowBtn('ti-archive','Archivo',pending(),"A.go('archive')")+rowBtn('ti-trash','Papelera',trash.length+' '+(trash.length===1?'elemento':'elementos'),"A.go('trash')")+'</div>';
return h}
function vCurs(){
var h=head('Monedas');
h+='<p class="sub" style="margin:0 2px 10px">La tasa configurada se usa para <b style="font-weight:500">estimar</b> gastos pendientes y registros nuevos. Al pagar registras lo realmente cobrado, y los pagos ya hechos nunca cambian.</p>';
h+='<div class="set"><div class="srow"><span class="cic">'+esc(sym())+'</span><span class="grow"><span class="t1 bl">'+esc(NAMES[st.def]||st.def)+' ('+st.def+')</span><span class="sub bl">Moneda predeterminada</span></span></div></div>';
if(!curs.length){h+='<p class="sub" style="margin:0 2px 10px">Aún no hay monedas agregadas.</p>'}
else{
h+='<div class="set">'+curs.map(function(c){
return '<button class="srow btn2" data-code="'+c.code+'" onclick="A.curEdit(this)" aria-label="Editar tasa de '+c.code+'"><span class="cic">'+esc(SYM[c.code]||c.code)+'</span><span class="grow"><span class="t1 bl">'+esc(NAMES[c.code]||c.code)+' ('+c.code+')'+(c.status==='stale'?'<span class="chip2">Necesita actualización</span>':'')+'</span><span class="sub bl">'+(c.rate?'1 '+c.code+' = '+sym()+' '+c.rate:'Sin tasa')+' · '+(c.src==='fetched'?'Obtenida':'Manual')+'</span>'+(c.pending?'<span class="sub bl">Usada en '+plural(c.pending,'registro pendiente','registros pendientes')+'</span>':'')+(c.status==='stale'?'<span class="sub bl" style="color:var(--text-warning)">Actualiza la tasa para usarla de nuevo.</span>':'')+'</span><span class="val">Editar tasa</span></button>'}).join('')+'</div>'}
var left=Object.keys(NAMES).filter(function(k){return k!==st.def&&!curOf(k)});
if(left.length){h+='<button class="plus" onclick="A.curAdd()"><i class="ti ti-plus" aria-hidden="true"></i> Agregar moneda</button>'}
else{h+='<p class="sub" style="margin:0 2px">Ya se agregaron todas las monedas admitidas.</p>'}
return h}
function vCats(){
var h=head('Categorías');
h+='<p class="sub" style="margin:0 2px 10px">Las categorías agrupan tus gastos e ingresos. El presupuesto mensual se fija aquí o en la pantalla Presupuesto.</p><button class="plus pri" onclick="A.catNew()"><i class="ti ti-plus" aria-hidden="true"></i> Agregar</button>';
['active','archived'].forEach(function(s){
var l=cats.filter(function(c){return c.state===s});
if(!l.length){return}
h+=secH(s==='active'?'Activas':'Archivadas');
h+='<div class="set">'+l.map(function(c){
return '<div class="srow"><span class="cic">'+(c.icon?'<i class="ti '+c.icon+'" aria-hidden="true"></i>':esc(c.name.charAt(0)))+'</span><span class="grow"><span class="t1 bl">'+esc(c.name)+(c.sys?'<span class="chip2 n">Predeterminada</span>':'')+'</span><span class="sub bl">'+tName(c.type)+' · '+plural(c.items,'elemento','elementos')+'</span><span class="sub bl">'+(c.budget!=null?'Presupuesto: '+sym()+' '+m(c.budget):'Sin presupuesto')+'</span></span><button class="kb" style="margin:0" data-id="'+c.id+'" aria-haspopup="dialog" aria-label="Opciones de '+esc(c.name)+'" onclick="A.catMenu(this)"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button></div>'}).join('')+'</div>'});
return h}
function catFormView(){
var f=S.form,isNew=!f.id,h=head(isNew?'Agregar categoría':'Editar categoría');
h+='<div class="fcard"><label class="fl" for="c-n">Nombre</label><input id="c-n" data-f="name" class="fi" type="text" autocomplete="off" placeholder="p. ej. Suscripciones" value="'+esc(f.name)+'">';
h+='<span class="fl" id="c-t">Aparece en</span><div class="seg" role="group" aria-labelledby="c-t" style="margin-top:4px">'+[['expense','Gasto'],['income','Ingreso'],['both','Ambos']].map(function(o){return '<button aria-pressed="'+(f.type===o[0])+'" onclick="A.ctype(\''+o[0]+'\')">'+o[1]+'</button>'}).join('')+'</div>';
if(f.type!=='income'){
h+='<label class="fl" for="c-b">Presupuesto mensual ('+esc(sym())+')</label><input id="c-b" data-f="budget" class="fi" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" value="'+esc(f.budget)+'">';
var sg=f.rec||0;
if(sg>0&&String(f.budget)!==String(sg)){h+='<p class="hint">Suma de tus recurrentes en esta categoría: '+sym()+' '+m(sg)+'. Es solo una sugerencia: el gasto único no sale de ahí. <button class="dt2" style="background:transparent;border:none;min-height:44px;color:var(--text-accent);text-decoration:underline;padding:0" onclick="A.usesg()">Usar sugerido</button></p>'}}
h+='<span class="fl" id="ic-l">Icono (opcional)</span><button class="srow btn2" data-row="icon" aria-labelledby="ic-l ic-v" onclick="A.iconOpen()" style="border:0.5px solid var(--border-strong);border-radius:8px;margin-top:4px;min-height:52px"><span class="cic">'+(f.icon?'<i class="ti '+f.icon+'" aria-hidden="true"></i>':esc((f.name.trim()||'?').charAt(0).toUpperCase()))+'</span><span class="grow" id="ic-v"><span class="t1 bl">'+esc(iconName(f.icon))+'</span></span><i class="ti ti-chevron-right" aria-hidden="true" style="color:var(--text-muted)"></i></button></div>';
h+='<p id="f-err" class="ferr" role="alert" hidden></p><div class="fbar"><button onclick="A.back()">Cancelar</button><button class="pri" onclick="A.catSave()">'+(isNew?'Crear':'Guardar cambios')+'</button></div>';
return h}
function vGroups(){
var h=head('Grupos recurrentes');
h+='<p class="sub" style="margin:0 2px 10px">Un grupo solo junta gastos para ver su total (por ejemplo, una tarjeta). Cada gasto sigue teniendo su propia fecha, monto y estado.</p><button class="plus pri" onclick="A.grpNew()"><i class="ti ti-plus" aria-hidden="true"></i> Nuevo grupo</button>';
if(!groups.length){h+='<p class="sub" style="margin:0 2px">Aún no tienes grupos.</p>'}
else{h+='<div class="set">'+groups.map(function(g){return '<div class="srow"><span class="cic"><i class="ti ti-folder" aria-hidden="true"></i></span><span class="grow"><span class="t1 bl">'+esc(g.name)+'</span><span class="sub bl">'+plural(g.members.length,'gasto','gastos')+'</span><span class="sub bl">'+esc(g.members.join(', '))+'</span></span><button class="kb" style="margin:0" data-id="'+g.id+'" aria-haspopup="dialog" aria-label="Opciones del grupo '+esc(g.name)+'" onclick="A.grpMenu(this)"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button></div>'}).join('')+'</div>'}
return h}
function listSel(items,kind){
var n=Object.keys(S.sel).filter(function(k){return S.sel[k]}).length,all=items.length&&n===items.length;
var h='<div class="tsel"><input class="ck" type="checkbox" id="sel-all" '+(all?'checked':'')+' onchange="A.selAll(this)" aria-label="Seleccionar todo"><label for="sel-all">'+(n?n+(n===1?' seleccionado':' seleccionados'):'Seleccionar todo')+'</label></div>';
if(n){h+='<div class="bulk"><button class="pri" onclick="A.bulkRestore()">Restaurar seleccionados</button>'+(kind==='archive'?'<button onclick="A.bulkTrash()">Mover a la papelera</button>':'<button class="dng" onclick="A.bulkPurge()">Eliminar seleccionados permanentemente</button>')+'</div>'}
return h}
function vArch(){
var h=head('Archivo');
h+='<p class="sub" style="margin:0 2px 10px">Lo archivado está oculto pero conserva su historial. Los recurrentes archivados dejan de generarse.</p>';
if(!archive.length){return h+'<p class="sub" style="margin:0 2px">No hay nada archivado.</p>'}
h+=listSel(archive,'archive');
h+='<div class="set">'+archive.map(function(r){return '<div class="srow"><input class="ck" type="checkbox" data-id="'+r.id+'" '+(S.sel[r.id]?'checked':'')+' onchange="A.sel(this)" aria-label="Seleccionar '+esc(r.name)+'"><span class="grow"><span class="t1 bl">'+esc(r.name)+'</span><span class="sub bl">'+r.type+' · Archivado el '+ds(r.date)+'</span></span><button class="kb" style="margin:0" data-id="'+r.id+'" aria-haspopup="dialog" aria-label="Opciones de '+esc(r.name)+'" onclick="A.rowMenu(this,\'archive\')"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button></div>'}).join('')+'</div>';
return h}
function vTrash(){
var h=head('Papelera');
h+='<p class="sub" style="margin:0 2px 10px">Lo eliminado se borra para siempre pasados '+st.retention+' días. Mientras tanto puedes restaurarlo.</p>';
if(!trash.length){return h+'<p class="sub" style="margin:0 2px">La papelera está vacía.</p>'}
h+=listSel(trash,'trash');
h+='<div class="set">'+trash.map(function(r){var dl=daysLeft(r);
return '<div class="srow"><input class="ck" type="checkbox" data-id="'+r.id+'" '+(S.sel[r.id]?'checked':'')+' onchange="A.sel(this)" aria-label="Seleccionar '+esc(r.name)+'"><span class="grow"><span class="t1 bl">'+esc(r.name)+'</span><span class="sub bl">'+r.type+' · Enviado a la papelera el '+ds(r.date)+'</span><span class="sub bl" style="'+(dl<=0?'color:var(--text-danger)':'')+'">'+(dl<=0?'<i class="ti ti-alert-circle" aria-hidden="true"></i> Se elimina permanentemente hoy':plural(dl,'día para la eliminación permanente','días para la eliminación permanente'))+'</span>'+(r.type==='Grupo'?'<span class="sub bl">Sus '+plural(r.members,'gasto vuelve','gastos vuelven')+' a él al restaurarlo.</span>':'')+'</span><button class="kb" style="margin:0" data-id="'+r.id+'" aria-haspopup="dialog" aria-label="Opciones de '+esc(r.name)+'" onclick="A.rowMenu(this,\'trash\')"><i class="ti ti-dots-vertical" aria-hidden="true"></i></button></div>'}).join('')+'</div>';
return h}
function render(){
var v=S.view,h=v==='root'?vRoot():v==='curs'?vCurs():v==='cats'?vCats():v==='catform'?catFormView():v==='groups'?vGroups():v==='archive'?vArch():vTrash();
document.getElementById('main').innerHTML=h;
document.getElementById('msg').innerHTML=S.msg}

/* ---------- hojas ---------- */
function actBtn(a,ic,lb,ds,cls,dis){return '<button class="act'+(cls?' '+cls:'')+'" data-a="'+a+'"'+(dis?' disabled style="opacity:.55"':'')+'><i class="ti '+ic+'" aria-hidden="true"></i><span><span class="al">'+lb+'</span><span class="ad">'+ds+'</span></span></button>'}
function foot(ok,okLb,leftA,leftLb,cls){return '<p id="s-err" class="ferr" role="alert" hidden></p><div class="fb"><button data-a="'+leftA+'">'+leftLb+'</button><button class="'+(cls||'pri')+'" data-a="'+ok+'">'+okLb+'</button></div>'}
function serr(t){var e=document.getElementById('s-err');e.textContent=t;e.hidden=false}
function sheet(){
var el=document.getElementById('sheet');
if(!S.sh){el.hidden=true;el.innerHTML='';document.body.style.overflow='';return}
var v=S.sh.view,h='',title='';
if(v==='signout'){title='Cerrar sesión';h='<p class="t2" style="margin:8px 0">Tus datos siguen guardados en tu cuenta. Podrás volver a entrar cuando quieras.</p>'+foot('signgo','Cerrar sesión','close','Cancelar')}
else if(v==='defcur'){
title='Moneda predeterminada';
var opts=[st.def].concat(curs.filter(function(c){return c.status==='ok'}).map(function(c){return c.code}));
h='<p class="t2" style="margin:0 0 6px">Las monedas por actualizar no aparecen aquí: primero confirma su tasa.</p>'+opts.map(function(c){return '<button class="act" data-a="defpick" data-c="'+c+'"><i class="ti ti-check" aria-hidden="true" style="visibility:'+(c===st.def?'visible':'hidden')+'"></i><span><span class="al">'+esc(NAMES[c]||c)+' ('+c+')</span></span></button>'}).join('')}
else if(v==='defconfirm'){
var nc=S.sh.code;title='Cambiar a '+nc;
h='<p class="t2" style="margin:0 0 6px">Antes de cambiar, esto es lo que pasa:</p>'+['Tus monedas agregadas quedarán como «Necesita actualización» hasta que confirmes su tasa hacia '+nc+'.','Las recomendaciones de presupuesto se recalcularán.','Tus pagos y registros anteriores no cambian: conservan su monto y su tasa de entonces.','Los presupuestos por categoría mantienen sus números. Revísalos después del cambio.'].map(function(t){return '<div class="li"><i class="ti ti-check" aria-hidden="true" style="color:var(--text-secondary)"></i><span>'+t+'</span></div>'}).join('')+foot('defgo','Cambiar a '+nc,'defcur','Atrás','dng')}
else if(v==='retention'){
title='Retención de la papelera';
h='<p class="t2" style="margin:0 0 6px">Lo eliminado se borra para siempre después de este plazo.</p>'+[7,14,30,60,90].map(function(d){return '<label class="rd"><input type="radio" name="ret" value="'+d+'"'+(d===st.retention?' checked':'')+'><span><span class="al">'+d+' días</span></span></label>'}).join('')+foot('retgo','Guardar','close','Cancelar')}
else if(v==='curedit'||v==='curadd'){
var add=v==='curadd',c=add?null:curOf(S.sh.code);
title=add?'Agregar moneda':'Actualizar tasa de '+c.code;
if(add){var left=Object.keys(NAMES).filter(function(k){return k!==st.def&&!curOf(k)});h+='<label class="fl" for="s-c">Moneda</label><select id="s-c" class="fi" onchange="A.curPick(this)">'+left.map(function(k){return '<option value="'+k+'">'+esc(NAMES[k])+' ('+k+')</option>'}).join('')+'</select>'}
var code=add?left[0]:c.code;
h+='<label class="fl" for="s-r" id="s-rl">1 <span id="s-cc">'+code+'</span> = '+esc(sym())+'</label><input id="s-r" class="fi" type="text" inputmode="decimal" autocomplete="off" value="'+(add||!c.rate?'':c.rate)+'" oninput="A.rateEdit()">';
h+='<button class="dt2" style="background:transparent;border:none;min-height:44px;padding:0;color:var(--text-accent);text-decoration:underline" data-a="fetch">Obtener tasa actual</button><p class="hint">Tasas de Exchange Rate API. Necesita conexión.</p>';
h+='<p class="hint">Se usa para estimar gastos pendientes y registros nuevos. Los pagos ya hechos no cambian.</p>'+foot('cursave',add?'Agregar':'Guardar','close','Cancelar')}
else if(v==='catmenu'){
var cc=catById(S.sh.id);title=esc(cc.name);
var block=cc.items>0?'No se puede eliminar: '+plural(cc.items,'registro todavía usa','registros todavía usan')+' esta categoría.':cc.sys?'Las categorías predeterminadas no se eliminan.':'No se puede deshacer.';
h=actBtn('cedit','ti-pencil','Editar','Nombre, tipo, presupuesto e icono')+actBtn('ctoggle',cc.state==='active'?'ti-archive':'ti-arrow-back-up',cc.state==='active'?'Archivar':'Activar',cc.state==='active'?'Deja de ofrecerse al crear registros':'Vuelve a ofrecerse')+'<div class="sep"></div>'+actBtn('cdel','ti-trash','Eliminar permanentemente',block,'dg',cc.items>0||cc.sys)}
else if(v==='catdel'){
var c2=catById(S.sh.id);title='¿Eliminar categoría permanentemente?';
h='<p class="t2" style="margin:0 0 6px">«'+esc(c2.name)+'» se eliminará permanentemente. Esta acción no se puede deshacer.</p>'+foot('cdelgo','Eliminar permanentemente','close','Cancelar','dng')}
else if(v==='grpmenu'){
var g=grpById(S.sh.id);title=esc(g.name);
h=actBtn('grename','ti-pencil','Renombrar','El nombre cambia en todos lados')+'<div class="sep"></div>'+actBtn('gdel','ti-trash','Eliminar grupo','Los gastos quedan sin grupo; se puede restaurar','dg')}
else if(v==='grpname'){

h='<label class="fl" for="s-n">Nombre del grupo</label><input id="s-n" class="fi" type="text" autocomplete="off" placeholder="Tarjeta de crédito" value="'+(g2?esc(g2.name):'')+'">'+foot('gnamesave',g2?'Guardar':'Crear','close','Cancelar')}
else if(v==='grpdel'){
var g3=grpById(S.sh.id);title='Eliminar grupo';
h='<p class="t2" style="margin:0 0 6px">Sus '+plural(g3.members.length,'gasto queda','gastos quedan')+' sin grupo, tanto recurrentes como únicos. Ninguno se borra. Si restauras el grupo desde la papelera, vuelven a él.</p>'+foot('gdelgo','Eliminar grupo','close','Cancelar','dng')}
else if(v==='restore'){
var q=S.sh.ids.map(function(id){return findRec(id)}),rec=q.some(function(r){return /recurrente/.test(r.type)});
title='Restaurar';
h='<p class="t2" style="margin:0 0 6px">'+(q.length===1?'Vas a restaurar «'+esc(q[0].name)+'».':'Vas a restaurar '+q.length+' elementos.')+(rec?' Los recurrentes vuelven a generarse desde el próximo ciclo.':'')+'</p>'+foot('restgo','Restaurar','close','Cancelar')}
else if(v==='purge'){
var p=S.sh.ids.map(function(id){return findRec(id)});title='¿Eliminar permanentemente?';
h='<p class="t2" style="margin:0 0 6px">'+(p.length===1?'Estás a punto de eliminar permanentemente este elemento:':'Estás a punto de eliminar permanentemente estos '+p.length+' elementos:')+'</p>'+p.map(function(r){return '<div class="li"><span>• '+esc(r.name)+'</span></div>'}).join('')+'<p class="t2" style="margin:8px 0 0">No se puede deshacer.</p>'+foot('purgego','Eliminar permanentemente','close','Cancelar','dng')}
else if(v==='rowmenu'){
var r=findRec(S.sh.id);title=esc(r.name);
h=actBtn('rrest','ti-arrow-back-up','Restaurar','Vuelve a estar activo')+'<div class="sep"></div>'+(S.sh.kind==='archive'?actBtn('rtrash','ti-trash','Mover a la papelera','Se elimina en '+st.retention+' días','dg'):actBtn('rpurge','ti-trash','Eliminar permanentemente','No se puede deshacer','dg'))}
else if(v==='lang'){
title='Idioma';
var q=norm(S.sh.q||''),ls=LANGS.filter(function(l){return !q||norm(l[1]).indexOf(q)>=0||norm(l[0]).indexOf(q)>=0});
if(LANGS.length>8){h+='<label class="fl" for="s-lq">Buscar idioma</label><input id="s-lq" class="fi" type="text" autocomplete="off" oninput="A.langq(this)" value="'+esc(S.sh.q||'')+'">'}
h+=ls.length?ls.map(function(l){return '<button class="act" data-a="langpick" data-l="'+l[0]+'"><i class="ti ti-check" aria-hidden="true" style="visibility:'+(l[0]===st.lang?'visible':'hidden')+'"></i><span><span class="al">'+esc(l[1])+'</span></span></button>'}).join(''):'<p class="t2" style="margin:8px 0">Sin resultados.</p>'}
else if(v==='icon'){
title='Elegir icono';
var pk=S.sh.pick,nm=S.form.name.trim();
h+='<div class="prevbox" aria-live="polite"><span class="cic">'+(pk?'<i class="ti '+pk+'" aria-hidden="true"></i>':esc((nm||'?').charAt(0).toUpperCase()))+'</span><span class="grow"><span class="t1 bl">'+esc(nm||'Nueva categoría')+'</span><span class="sub bl">Así se verá · '+esc(iconName(pk))+'</span></span></div>';
h+='<div class="igrid" role="group" aria-label="Iconos disponibles">'+ICONS.map(function(o){return '<button class="ig'+(o[0]?'':' none')+'" data-a="ipick" data-i="'+o[0]+'" aria-pressed="'+(o[0]===pk)+'" aria-label="'+esc(o[1])+'">'+(o[0]?'<i class="ti '+o[0]+'" aria-hidden="true"></i>':'Sin<br>icono')+(o[0]===pk?'<i class="ti ti-check ck3" aria-hidden="true"></i>':'')+'</button>'}).join('')+'</div>'+foot('iuse','Usar icono','close','Cancelar')}
else if(v==='discard'){title='¿Descartar cambios?';h='<p class="t2" style="margin:0 0 6px">Tienes cambios sin guardar.</p>'+foot('discardgo','Descartar','close','Seguir editando','dng')}
var out='<div class="sp" role="dialog" aria-modal="true" aria-labelledby="sht"><div class="grab"></div><div class="sph"><h2 id="sht">'+title+'</h2><button class="kb" style="margin:0" aria-label="Cerrar" data-a="close"><i class="ti ti-x" aria-hidden="true"></i></button></div>'+h+'</div>';
el.innerHTML=out;el.hidden=false;document.body.style.overflow='hidden';
var f=el.querySelector('.fi')||el.querySelector('.act:not([disabled])')||el.querySelector('.fb button');
if(f){f.focus()}}
function findRec(id){var a=archive.concat(trash);for(var i=0;i<a.length;i++){if(a[i].id===id)return a[i]}return null}
function closeSheet(){var o=S.sh&&S.sh.key,rw=S.sh&&S.sh.row;S.sh=null;sheet();render();var b=o?document.querySelector('.kb[data-id="'+o+'"]'):null;if(!b&&rw){b=document.querySelector('[data-row="'+rw+'"]')}if(b){b.focus()}}
function selIds(){return Object.keys(S.sel).filter(function(k){return S.sel[k]})}
function applyTheme(){var r=document.documentElement;if(st.theme==='system'){r.removeAttribute('data-theme')}else{r.setAttribute('data-theme',st.theme)}}
function goto(v){S.view=v;S.sel={};S.msg='';render();window.scrollTo(0,0)}

var A={
go:function(v){goto(v)},
back:function(){if(S.view==='catform'&&JSON.stringify(S.form)!==S.formInit){S.sh={view:'discard'};sheet();return}S.form=null;goto(S.view==='catform'?'cats':'root')},
signout:function(){S.sh={view:'signout'};sheet()},
login:function(){S.msg='Abriría la pantalla para crear cuenta o iniciar sesión.';render()},
defcur:function(){S.sh={view:'defcur',row:'def'};sheet()},
langOpen:function(){S.sh={view:'lang',q:'',key:null,row:'lang'};sheet()},
langq:function(el){S.sh.q=el.value;var p=el.selectionStart;sheet();var n=document.getElementById('s-lq');if(n){n.focus();n.setSelectionRange(p,p)}},
iconOpen:function(){S.sh={view:'icon',pick:S.form.icon,key:null,row:'icon'};sheet();var g=document.querySelector('.igrid [aria-pressed="true"]');if(g){g.focus()}},
theme:function(t){st.theme=t;applyTheme();S.msg='Tema: '+({light:'Claro',dark:'Oscuro',system:'Sistema'}[t])+'.';render()},
remOn:function(el){st.rem.on=el.checked;S.msg=el.checked?'Recordatorios activados.':'Recordatorios desactivados.';render()},
lead:function(d){var n=st.rem.lead+d;if(n<1||n>14){return}st.rem.lead=n;document.getElementById('lead-v').textContent=n},
remT:function(el){st.rem.time=el.value;S.msg=el.value?'Los avisos llegarán a las '+el.options[el.selectedIndex].text+'.':'Los avisos no tendrán hora fija.';render()},
ret:function(){S.sh={view:'retention'};sheet()},
curEdit:function(b){S.sh={view:'curedit',code:b.dataset.code,key:null};sheet()},
curAdd:function(){S.sh={view:'curadd'};sheet()},
curPick:function(el){document.getElementById('s-cc').textContent=el.value;S.sh.src='manual'},
rateEdit:function(){S.sh.src='manual'},
catNew:function(){S.form={id:null,name:'',type:'expense',budget:'',icon:'',rec:0};S.formInit=JSON.stringify(S.form);S.view='catform';render();window.scrollTo(0,0);document.getElementById('c-n').focus()},
catMenu:function(b){S.sh={view:'catmenu',id:b.dataset.id,key:b.dataset.id};sheet()},
ctype:function(t){S.form.type=t;S.form.budget=t==='income'?'':S.form.budget;render()},
usesg:function(){S.form.budget=String(S.form.rec);render()},
catSave:function(){
var f=S.form,nm=f.name.trim(),er=document.getElementById('f-err'),msg='';
var b=f.budget===''?null:parseFloat(String(f.budget).replace(/,/g,''));
if(!nm){msg='Escribe un nombre.'}
else if(cats.some(function(c){return c.id!==f.id&&c.name.toLowerCase()===nm.toLowerCase()})){msg='Ya existe una categoría con ese nombre.'}
else if(b!==null&&!(b>=0)){msg='El presupuesto debe ser un número mayor o igual a 0.'}
if(msg){er.textContent=msg;er.hidden=false;return}
if(f.id){var c=catById(f.id);c.name=nm;c.type=f.type;c.icon=f.icon;c.budget=f.type==='income'?null:b;S.msg='Categoría «'+esc(nm)+'» actualizada.'}
else{cats.push({id:uid(),name:nm,type:f.type,icon:f.icon,budget:f.type==='income'?null:b,sys:false,state:'active',items:0,rec:0});S.msg='Categoría «'+esc(nm)+'» creada.'}
S.form=null;S.view='cats';render();window.scrollTo(0,0)},
grpNew:function(){S.sh={view:'grpname',id:null};sheet()},
grpMenu:function(b){S.sh={view:'grpmenu',id:b.dataset.id,key:b.dataset.id};sheet()},
sel:function(el){S.sel[el.dataset.id]=el.checked;render()},
selAll:function(el){var l=S.view==='archive'?archive:trash;S.sel={};if(el.checked){l.forEach(function(r){S.sel[r.id]=true})}render()},
rowMenu:function(b,kind){S.sh={view:'rowmenu',id:b.dataset.id,kind:kind,key:b.dataset.id};sheet()},
bulkRestore:function(){S.sh={view:'restore',ids:selIds()};sheet()},
bulkTrash:function(){A.doTrash(selIds())},
bulkPurge:function(){S.sh={view:'purge',ids:selIds()};sheet()},
doTrash:function(ids){
var n=0;ids.forEach(function(id){for(var i=0;i<archive.length;i++){if(archive[i].id===id){var r=archive.splice(i,1)[0];r.date=TODAY;trash.push(r);n++;break}}});
S.sel={};S.msg=n===1?'Se movió a la papelera.':n+' elementos se movieron a la papelera.';render()},
act:function(a,b){
if(a==='close'){closeSheet();return}
if(a==='discardgo'){S.sh=null;sheet();S.form=null;goto('cats');return}
if(a==='signgo'){user.signedIn=false;S.msg='Sesión cerrada.';closeSheet();return}
if(a==='langpick'){var l=b.dataset.l;st.lang=l;document.documentElement.lang=l;S.msg='Idioma: '+langName(l)+(l==='es'?'.':'. (En la app se traducen todos los textos.)');closeSheet();return}
if(a==='ipick'){S.sh.pick=b.dataset.i;sheet();var g=document.querySelector('.igrid [aria-pressed="true"]');if(g){g.focus()}return}
if(a==='iuse'){S.form.icon=S.sh.pick;S.sh=null;sheet();render();var ib=document.querySelector('[data-row="icon"]');if(ib){ib.focus()}return}
if(a==='defpick'){var c=b.dataset.c;if(c===st.def){closeSheet();return}S.sh={view:'defconfirm',code:c,row:'def'};sheet();return}
if(a==='defcur'){S.sh={view:'defcur',row:'def'};sheet();return}
if(a==='defgo'){
var nc=S.sh.code,old=st.def;
curs=curs.filter(function(x){return x.code!==nc});
curs.push({code:old,rate:null,src:'manual',status:'stale',pending:0});
curs.forEach(function(x){x.status='stale'});
st.def=nc;S.msg='Moneda predeterminada: '+nc+'. Actualiza la tasa de tus monedas para usarlas de nuevo.';closeSheet();return}
if(a==='retgo'){var r=document.querySelector('input[name="ret"]:checked');st.retention=+r.value;S.msg='La papelera conservará lo eliminado '+st.retention+' días.';closeSheet();return}
if(a==='fetch'){
var code=S.sh.view==='curadd'?document.getElementById('s-c').value:S.sh.code;
if(!navigator.onLine&&false){serr('Sin conexión.');return}
document.getElementById('s-r').value=LIVE[code];S.sh.src='fetched';return}
if(a==='cursave'){
var add=S.sh.view==='curadd',cd=add?document.getElementById('s-c').value:S.sh.code,rt=parseFloat(document.getElementById('s-r').value.replace(/,/g,''));
if(!(rt>0)){serr('Escribe una tasa mayor que 0.');return}
var src=S.sh.src||(add?'manual':(curOf(cd).src));
if(add){curs.push({code:cd,rate:rt,src:src,status:'ok',pending:0});S.msg='Moneda '+cd+' agregada.'}
else{var cc=curOf(cd);cc.rate=rt;cc.src=src;cc.status='ok';S.msg='Tasa de '+cd+' actualizada. Los pagos ya hechos no cambian.'}
closeSheet();return}
if(a==='cedit'){var c3=catById(S.sh.id);S.form={id:c3.id,name:c3.name,type:c3.type,budget:c3.budget!=null?String(c3.budget):'',icon:c3.icon,rec:c3.rec};S.formInit=JSON.stringify(S.form);S.sh=null;sheet();S.view='catform';render();window.scrollTo(0,0);return}
if(a==='ctoggle'){var c4=catById(S.sh.id);c4.state=c4.state==='active'?'archived':'active';S.msg='«'+esc(c4.name)+'» ahora está '+(c4.state==='active'?'activa':'archivada')+'.';closeSheet();return}
if(a==='cdel'){S.sh.view='catdel';sheet();return}
if(a==='cdelgo'){var c5=catById(S.sh.id);cats.splice(cats.indexOf(c5),1);S.msg='«'+esc(c5.name)+'» eliminada permanentemente.';closeSheet();return}
if(a==='grename'){S.sh.view='grpname';sheet();return}
if(a==='gnamesave'){
var nm=document.getElementById('s-n').value.trim();
if(!nm){serr('Escribe un nombre para el grupo.');return}
if(S.sh.id){var g=grpById(S.sh.id);g.name=nm;S.msg='Grupo «'+esc(nm)+'» renombrado.'}
else{groups.push({id:uid(),name:nm,members:[]});S.msg='Grupo «'+esc(nm)+'» creado.'}
closeSheet();return}
if(a==='gdel'){S.sh.view='grpdel';sheet();return}
if(a==='gdelgo'){var g2=grpById(S.sh.id);groups.splice(groups.indexOf(g2),1);trash.push({id:uid(),name:g2.name,type:'Grupo',date:TODAY,members:g2.members.length});S.msg='Grupo «'+esc(g2.name)+'» eliminado; sus gastos quedaron sin grupo. Se puede restaurar desde la papelera.';closeSheet();return}
if(a==='rrest'){S.sh={view:'restore',ids:[S.sh.id],key:S.sh.key};sheet();return}
if(a==='rtrash'){var id=S.sh.id;S.sh=null;sheet();A.doTrash([id]);return}
if(a==='rpurge'){S.sh={view:'purge',ids:[S.sh.id],key:S.sh.key};sheet();return}
if(a==='restgo'){
var ids=S.sh.ids;
ids.forEach(function(id){[archive,trash].forEach(function(l){for(var i=0;i<l.length;i++){if(l[i].id===id){var r=l.splice(i,1)[0];if(r.type==='Grupo'){groups.push({id:uid(),name:r.name,members:[]})}break}}})});
S.sel={};S.msg=ids.length===1?'Restaurado.':ids.length+' elementos restaurados.';S.sh=null;sheet();render();return}
if(a==='purgego'){
var pids=S.sh.ids;
pids.forEach(function(id){for(var i=0;i<trash.length;i++){if(trash[i].id===id){trash.splice(i,1);break}}});
S.sel={};S.msg=pids.length===1?'Eliminado permanentemente.':pids.length+' elementos eliminados permanentemente.';S.sh=null;sheet();render();return}
}
};
document.getElementById('sheet').addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(b&&!b.disabled){A.act(b.dataset.a,b)}else if(ev.target===this){closeSheet()}});
document.getElementById('main').addEventListener('input',function(ev){var k=ev.target.dataset&&ev.target.dataset.f;if(k&&S.form){S.form[k]=ev.target.value}});
document.getElementById('main').addEventListener('change',function(ev){var k=ev.target.dataset&&ev.target.dataset.f;if(k&&S.form){S.form[k]=ev.target.value}});
document.addEventListener('keydown',function(ev){
if(!S.sh){return}
if(ev.key==='Escape'){closeSheet();return}
if(ev.key==='Tab'){
var sp=document.querySelector('#sheet .sp');if(!sp){return}
var f=Array.prototype.filter.call(sp.querySelectorAll('button,input,select'),function(n){return !n.disabled});
if(!f.length){return}
var first=f[0],last=f[f.length-1];
if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}});
render();
</script>
</body>
</html>
